  <path d="M852 291L882 311L852 331" stroke="#E5E7EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="902" y="282" width="96" height="58" rx="7" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="2"/>
  <text x="914" y="306" fill="#38BDF8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Low</text>
  <text x="912" y="327" fill="#38BDF8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">level</text>

  <rect x="70" y="420" width="960" height="190" rx="8" fill="#111827" stroke="#F97316" stroke-width="3"/>
