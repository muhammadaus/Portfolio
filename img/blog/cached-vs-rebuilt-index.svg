  <text x="102" y="215" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Long-running service</text>
  <text x="102" y="250" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="18">build once -> keep warm -> answer many small requests</text>
  <rect x="104" y="282" width="150" height="58" rx="7" fill="#38BDF8"/>
