<svg width="1100" height="700" viewBox="0 0 1100 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="700" fill="#0F172A"/>
  <text x="60" y="72" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Cached index or rebuilt pipeline?</text>
  <text x="60" y="112" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="22">The right optimization depends on whether build cost is paid once or repeatedly.</text>

